<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑名單列表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        button, [onclick], [role="button"], .cursor-pointer { touch-action: manipulation; }
        button { -webkit-appearance: none; appearance: none; }
        button svg, button i, [onclick] svg, [onclick] i { pointer-events: none; }
        .grid-cols-15 { grid-template-columns: repeat(15, minmax(0, 1fr)); }
        @media (min-width: 768px) {
            .md\:grid-cols-15 { grid-template-columns: repeat(15, minmax(0, 1fr)); }

<body class="max-w-7xl mx-auto bg-gray-50 min-h-screen flex flex-col">

    <header id="page-header" class="bg-red-700 text-white p-4 shadow-lg sticky top-0 z-50">

            <h1 class="text-xl font-bold flex items-center gap-2">

                <span>黑名單列表</span>
            </h1>

                <span id="status-text">載入中</span>

    <main class="flex-grow p-4 overflow-y-auto">

                    <div class="min-w-0">

                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <button onclick="exportExcel()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-xl font-bold flex items-center justify-center gap-1.5 shadow-sm shadow-green-100 transition text-xs md:text-sm">
                            <i data-lucide="file-spreadsheet" size="14"></i>
                            <span class="hidden sm:inline">匯出</span>
                            <span class="sm:hidden">匯出</span>

                        <button onclick="document.getElementById('import-excel-file').click()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl font-bold flex items-center justify-center gap-1.5 shadow-sm shadow-blue-100 transition text-xs md:text-sm">
                            <i data-lucide="upload" size="14"></i>
                            <span class="hidden sm:inline">匯入</span>

                        </button>

                </div>

                    <div class="relative w-full">
                        <select id="filter-region" onchange="applyFilters()" class="w-full appearance-none bg-white border border-gray-200 rounded-xl px-8 pl-4 py-2 text-sm font-bold text-gray-700 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none">
                            <option value="">全部區域</option>
                            <option value="台北">台北</option>
                            <option value="新北">新北</option>
                            <option value="桃園">桃園</option>

                        <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    </div>
                    <div class="relative w-full">
                        <select id="filter-position" onchange="applyFilters()" class="w-full appearance-none bg-white border border-gray-200 rounded-xl px-8 pl-4 py-2 text-sm font-bold text-gray-700 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none">
                            <option value="">全部職稱</option>
                            <option value="公司幹部">公司幹部</option>
                            <option value="總幹事">總幹事</option>
                            <option value="秘書">秘書</option>
                            <option value="清潔">清潔</option>
                            <option value="機電">機電</option>
                            <option value="保全">保全</option>

                            <option value="機電">機電</option>

    <script>
        const POSITION_OPTIONS = ['公司幹部', '總幹事', '秘書', '清潔', '機電', '保全', '臨時保全'];
        const REGION_OPTIONS = ['台北', '新北', '桃園'];
        const DEFAULT_REASON_OPTIONS = ['案調未過'];
        const REASON_STORAGE_KEY = 'nw_blacklist_custom_reasons';

        let db = null;
        let rootRef = null;
        let blacklistUnsub = null;
        let allRows = [];
        let currentUid = null;
        let currentEditPhotoDataUrl = '';
        let customReasonOptions = [];

        function loadCustomReasons() {
            try {
                const raw = localStorage.getItem(REASON_STORAGE_KEY);
                const arr = raw ? JSON.parse(raw) : [];
                customReasonOptions = Array.isArray(arr) ? arr.filter(x => typeof x === 'string' && x.trim()) : [];
            } catch (_) {
                customReasonOptions = [];
            }
        }
        function saveCustomReasons() {
            try {
                localStorage.setItem(REASON_STORAGE_KEY, JSON.stringify(customReasonOptions));
            } catch (_) {}
        }
        function getAllReasonOptions() {
            const merged = [];
            DEFAULT_REASON_OPTIONS.forEach(x => { if (!merged.includes(x)) merged.push(x); });
            customReasonOptions.forEach(x => { if (!merged.includes(x)) merged.push(x); });
            return merged;
        }
        function rebuildReasonSelect(selectedValue) {
            const sel = document.getElementById('edit-reason');
            if (!sel) return;
            const options = getAllReasonOptions();
            sel.innerHTML = '<option value=""></option>' + options.map(v => {
                const selected = v === selectedValue ? ' selected' : '';
                return `<option value="${v.replace(/"/g, '&quot;')}"${selected}>${v}</option>`;
            }).join('');
        }
        function addCustomReason() {
            const customInput = document.getElementById('edit-reason-custom');
            const sel = document.getElementById('edit-reason');
            if (!customInput || !sel) return;
            if (customInput.classList.contains('hidden')) {
                customInput.classList.remove('hidden');
                customInput.focus();
                return;
            }
            const rawVal = String(customInput.value || '').trim();
            if (!rawVal) {
                customInput.classList.add('hidden');
                return;
            }
            if (!customReasonOptions.includes(rawVal)) {
                customReasonOptions.push(rawVal);
                saveCustomReasons();
            }
            rebuildReasonSelect(rawVal);
            sel.value = rawVal;
            customInput.value = '';
            customInput.classList.add('hidden');
        }
        function handleAddressInput() {
            const addrEl = document.getElementById('edit-address');
            const regionEl = document.getElementById('edit-region');
            if (!addrEl || !regionEl) return;
            const addr = String(addrEl.value || '').trim();
            if (!addr) return;
            const currentRegion = regionEl.value;
            if (currentRegion && REGION_OPTIONS.includes(currentRegion)) return;
            let matched = '';
            if (/台北市|臺北市/.test(addr)) matched = '台北';
            else if (/新北市/.test(addr)) matched = '新北';
            else if (/桃園市|桃園縣/.test(addr)) matched = '桃園';
            else {
                for (const r of REGION_OPTIONS) {
                    if (addr.startsWith(r) || addr.includes(r + '市') || addr.includes(r + '縣')) {
                        matched = r;
                        break;
                    }
                }
            }
            if (matched && !regionEl.value) regionEl.value = matched;
        }

        function setEditPhotoPreview(dataUrl) {
            const preview = document.getElementById('edit-photo-preview');
            const empty = document.getElementById('edit-photo-empty');
            if (!preview || !empty) return;
            currentEditPhotoDataUrl = dataUrl || '';
            if (currentEditPhotoDataUrl) {
                preview.src = currentEditPhotoDataUrl;
                preview.classList.remove('hidden');
                empty.classList.add('hidden');
            } else {
                preview.removeAttribute('src');
                preview.classList.add('hidden');
                empty.classList.remove('hidden');
            }
        }
        function clearEditPhoto() {
            const fileInput = document.getElementById('edit-photo-file');
            if (fileInput) fileInput.value = '';
            setEditPhotoPreview('');
        }
        function handleEditPhotoFileChange(event) {
            const file = event && event.target && event.target.files && event.target.files[0];
            const errEl = document.getElementById('edit-error');
            if (errEl) { errEl.classList.add('hidden'); errEl.textContent = ''; }
            if (!file) return;
            if (!/^image\//.test(file.type)) {
                if (errEl) { errEl.textContent = '請選擇圖片檔案 (JPG / PNG)'; errEl.classList.remove('hidden'); }
                return;
            }
            const MAX = 8 * 1024 * 1024;
            if (file.size > MAX) {
                if (errEl) { errEl.textContent = '圖片大小不可超過 8 MB'; errEl.classList.remove('hidden'); }
                return;
            }
            const reader = new FileReader();
            reader.onload = () => setEditPhotoPreview(String(reader.result || ''));
            reader.onerror = () => {
                if (errEl) { errEl.textContent = '圖片讀取失敗，請更換檔案'; errEl.classList.remove('hidden'); }
            };
            reader.readAsDataURL(file);
        }

        function pad2(n) { return String(n).padStart(2, '0'); }
        function toInputDate(d) {
            const x = d instanceof Date ? d : new Date(d);
            if (isNaN(x.getTime())) return '';
            return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
        }
        function toDisplayDate(d) {
            const x = d instanceof Date ? d : new Date(d);
            if (isNaN(x.getTime())) return '';
            return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
        }
        function createdAtToDate(raw) {
            if (!raw) return null;
            if (typeof raw.toDate === 'function') {
                const t = raw.toDate();
                return isNaN(t.getTime()) ? null : t;
            }
            if (typeof raw === 'number') {
                const t = new Date(raw);
                return isNaN(t.getTime()) ? null : t;
            }
            if (typeof raw === 'string') {
                const t = new Date(raw);
                return isNaN(t.getTime()) ? null : t;
            }
            return null;
        }
        function isValidTwId(id) {
            if (typeof id !== 'string') return false;
            const v = id.trim().toUpperCase();
            if (!/^[A-Z][12][0-9]{8}$/.test(v)) return false;
            const map = { A:10, B:11, C:12, D:13, E:14, F:15, G:16, H:17, I:34, J:18, K:19, L:20, M:21, N:22, O:35, P:23, Q:24, R:25, S:26, T:27, U:28, V:29, W:32, X:30, Y:31, Z:33 };
            const first = map[v[0]];
            if (first == null) return false;
            let sum = Math.floor(first / 10) + (first % 10) * 9;
            for (let i = 1; i <= 8; i++) sum += Number(v[i]) * (9 - i);
            sum += Number(v[9]);
            return sum % 10 === 0;
        }

        async function bootstrap() {
            const { auth, db: firestore } = initFirebaseCompat();
            db = firestore;
            const appId = getAppId();
            rootRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('blacklist');

            try {
                setConnected(true);
            } catch (_) {}

            try {
                const current = await new Promise(resolve => {
                    const off = auth.onAuthStateChanged(u => { off(); resolve(u); });
                    setTimeout(() => { try { off(); resolve(auth.currentUser); } catch(_) { resolve(auth.currentUser); } }, 5000);
                });

                if (!current) {
                    showAuth('請先回首頁登入後，方可使用黑名單管理功能。');
                    return;
                }
                currentUid = current.uid || null;
                hideAuth();

        function subscribeBlacklist() {
            if (!rootRef) return;
            if (blacklistUnsub) { try { blacklistUnsub(); } catch (_) {} blacklistUnsub = null; }
            try {
                blacklistUnsub = rootRef.orderBy('createdAt', 'desc').limit(1000).onSnapshot(
                    (snap) => {
                        setConnected(true);
                        allRows = [];
                        snap.forEach(doc => {
                            const d = doc.data() || {};
                            allRows.push({
                                id: doc.id,
                                createdAt: createdAtToDate(d.createdAt) || new Date(),
                                position: String(d.position || '').trim(),
                                name: String(d.name || '').trim(),
                                birth: String(d.birth || '').trim(),
                                idNumber: String(d.idNumber || '').trim(),
                                phone: String(d.phone || '').trim(),
                                region: String(d.region || '').trim(),
                                address: String(d.address || '').trim(),
                                reason: String(d.reason || '').trim(),
                                photo: String(d.photo || '').trim(),
                                updatedAt: d.updatedAt || null,
                                createdBy: d.createdBy || null
                            });
                        });
                        applyFilters();
                    },
                    () => {
                        setConnected(false);
                        allRows = [];
                        applyFilters();
                    }
                );
            } catch (_) { setConnected(false); }
        }

        function applyFilters() {
            const region = (document.getElementById('filter-region') || {}).value || '';
            const position = (document.getElementById('filter-position') || {}).value || '';
            const keywordRaw = ((document.getElementById('filter-keyword') || {}).value || '').trim();
            const keyword = keywordRaw.toLowerCase();
            const clearBtn = document.getElementById('filter-keyword-clear');
            if (clearBtn) clearBtn.classList.toggle('hidden', !keywordRaw);
            const rows = allRows.filter(r => {
                if (region && r.region !== region) return false;
                if (position && r.position !== position) return false;
                if (keyword) {
                    const nameMatch = String(r.name || '').toLowerCase().includes(keyword);
                    const phoneRaw = String(r.phone || '').replace(/\s|-+/g, '');
                    const phoneMatch = phoneRaw.includes(keyword.replace(/\s|-+/g, ''));
                    const addressMatch = String(r.address || '').toLowerCase().includes(keyword);
                    const reasonMatch = String(r.reason || '').toLowerCase().includes(keyword);
                    if (!nameMatch && !phoneMatch && !addressMatch && !reasonMatch) return false;
                }
                return true;
            });
            setCountLabel(rows.length, allRows.length);
            renderRows(rows);
        }

        function clearKeywordFilter() {
            const el = document.getElementById('filter-keyword');

        function validateEditForm() {
            const createdAtRaw = document.getElementById('edit-createdAt').value || '';
            const position = String(document.getElementById('edit-position').value || '').trim();
            const name = String(document.getElementById('edit-name').value || '').trim();
            const birth = String(document.getElementById('edit-birth').value || '').trim();
            let idNumber = String(document.getElementById('edit-idNumber').value || '').trim().toUpperCase();
            const phone = String(document.getElementById('edit-phone').value || '').trim().replace(/\s|-+/g, '');
            const region = String(document.getElementById('edit-region').value || '').trim();
            const address = String(document.getElementById('edit-address').value || '').trim();
            const reason = String(document.getElementById('edit-reason').value || '').trim();
            const photo = (currentEditPhotoDataUrl || '').trim();

            if (!createdAtRaw || !/^\d{4}-\d{2}-\d{2}$/.test(createdAtRaw)) return '請選擇有效的建檔日期 (YYYY-MM-DD)';
            const createdDate = new Date(createdAtRaw + 'T00:00:00');
            if (isNaN(createdDate.getTime())) return '建檔日期格式錯誤';

            if (position && !POSITION_OPTIONS.includes(position)) return '若填寫職稱，請選擇有效的選項';
            if (!name) return '姓名不可為空';

            let birthDate = null;
            if (birth) {
                if (!/^\d{4}-\d{2}-\d{2}$/.test(birth)) return '若填寫出生年月日，請選擇有效的日期 (YYYY-MM-DD)';
                birthDate = new Date(birth + 'T00:00:00');
                if (isNaN(birthDate.getTime())) return '出生年月日格式錯誤';
                if (birthDate.getTime() > Date.now()) return '出生年月日不可為未來';
            }

            if (idNumber && !isValidTwId(idNumber)) return '若填寫身分證號，格式需為 1 碼英文 + 9 碼數字，且符合檢查碼規則';
            if (phone && !/^(09\d{8}|09\d{2}-\d{3}-\d{3}|09\d{2}-\d{6}|09\d{6}\d{2})$/.test(phone.replace(/-+/g, ''))) return '若填寫手機號碼，請輸入有效的台灣手機格式 (例如：0912345678)';
            if (region && !REGION_OPTIONS.includes(region)) return '若填寫區域，請選擇有效的選項';
            if (reason && !getAllReasonOptions().includes(reason)) return '若填寫事由，請選擇有效的選項或先加入自訂事由';

            return {
                createdAt: createdDate,
                position: position || '',
                name,
                birth: birth || '',
                idNumber: idNumber || '',
                phone: phone || '',
                region: region || '',
                address: address || '',
                reason: reason || '',
                photo
            };
        }

        async function submitEditModal() {
            if (!rootRef) return;
            const errEl = document.getElementById('edit-error');
            errEl.classList.add('hidden');
            errEl.textContent = '';
            const result = validateEditForm();
            if (typeof result === 'string') {
                errEl.textContent = result;
                errEl.classList.remove('hidden');
                return;
            }

            const docId = String(document.getElementById('edit-id').value || '').trim();
            const btn = document.getElementById('edit-submit-btn');
            const prevText = btn.textContent;
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            btn.textContent = '處理中…';
            try {
                const now = new Date();
                if (docId) {
                    await rootRef.doc(docId).update({
                        createdAt: firebase.firestore.Timestamp.fromDate(result.createdAt),
                        position: result.position,
                        name: result.name,
                        birth: result.birth,
                        idNumber: result.idNumber,
                        phone: result.phone,
                        region: result.region,
                        address: result.address,
                        reason: result.reason,
                        photo: result.photo,
                        updatedAt: firebase.firestore.Timestamp.fromDate(now)
                    });
                } else {
                    await rootRef.add({
                        createdAt: firebase.firestore.Timestamp.fromDate(result.createdAt),
                        position: result.position,
                        name: result.name,
                        birth: result.birth,
                        idNumber: result.idNumber,
                        phone: result.phone,
                        region: result.region,
                        address: result.address,
                        reason: result.reason,
                        photo: result.photo,
                        createdBy: currentUid || null,
                        updatedAt: firebase.firestore.Timestamp.fromDate(now)
                    });
                }
                closeEditModal();
            } catch (e) {
                errEl.textContent = (e && e.message) ? `儲存失敗：${e.message}` : '儲存失敗，請確認網路後再試';
                errEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                btn.textContent = prevText;
            }
        }

        function openConfirmDelete(id, nameText) {
            const row = allRows.find(r => r.id === id);
            if (!row) return;
            document.getElementById('confirm-id').value = String(row.id || '');
            const detail = [];
            if (row.position) detail.push(row.position);
            if (row.region) detail.push(row.region);
            if (row.reason) detail.push(row.reason);
            document.getElementById('confirm-message').textContent = `確定要將「${String(nameText || '未命名')}」從黑名單中移除？`;
            document.getElementById('confirm-detail').textContent = detail.length ? detail.join(' · ') : '';
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
            document.getElementById('confirm-id').value = '';
        }

        async function submitConfirmDelete() {
            if (!rootRef) return;
            const docId = String(document.getElementById('confirm-id').value || '').trim();
            if (!docId) return;
            try {
                await rootRef.doc(docId).delete();
                closeConfirmModal();
            } catch (_) {
                alert('移除失敗，請確認網路狀態或權限後再試。');
            }
        }

        function exportExcel() {
            if (!allRows || allRows.length === 0) {
                alert('目前沒有可匯出的黑名單資料。');
                return;
            }
            if (typeof XLSX === 'undefined') {
                alert('Excel 匯出模組尚未載入完成，請稍後再試。');
                return;
            }
            const headerMap = [
                ['createdAt', '建檔日期'],
                ['position', '職稱'],
                ['name', '姓名'],
                ['birth', '出生年月日'],
                ['idNumber', '身分證號'],
                ['phone', '手機號碼'],
                ['region', '區域'],
                ['address', '地址'],
                ['reason', '事由']
            ];
            const data = allRows.map(r => {
                const row = {};
                headerMap.forEach(([key, label]) => {
                    let val = r[key];
                    if (key === 'createdAt') {
                        val = toDisplayDate(r.createdAt);
                    }
                    row[label] = val != null ? val : '';
                });
                return row;
            });
            const ws = XLSX.utils.json_to_sheet(data, { header: headerMap.map(x => x[1]) });
            ws['!cols'] = [
                { wch: 12 }, { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 14 },
                { wch: 14 }, { wch: 8 }, { wch: 30 }, { wch: 20 }
            ];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '黑名單');
            const now = new Date();
            const fname = `黑名單_${now.getFullYear()}${pad2(now.getMonth() + 1)}${pad2(now.getDate())}.xlsx`;
            XLSX.writeFile(wb, fname);
        }

        function normalizePhone(raw) {
            return String(raw || '').replace(/\s|-+/g, '');
        }

        function validateImportRow(obj, idx) {
            const name = String(obj['姓名'] || obj['name'] || '').trim();
            const createdAtRaw = String(obj['建檔日期'] || obj['createdAt'] || '').trim();
            const errors = [];
            if (!name) errors.push(`第 ${idx} 列：姓名不可為空`);
            let createdDate = null;
            if (createdAtRaw) {
                if (/^\d{4}-\d{2}-\d{2}$/.test(createdAtRaw)) {
                    createdDate = new Date(createdAtRaw + 'T00:00:00');
                } else if (typeof obj['建檔日期'] === 'string' && obj['建檔日期']) {
                    const t = new Date(obj['建檔日期']);
                    if (!isNaN(t.getTime())) createdDate = t;
                }
            }
            if (!createdDate || isNaN(createdDate.getTime())) {
                createdDate = new Date();
            }
            const position = String(obj['職稱'] || obj['position'] || '').trim();
            const birth = String(obj['出生年月日'] || obj['birth'] || '').trim();
            let idNumber = String(obj['身分證號'] || obj['idNumber'] || '').trim().toUpperCase();
            const phone = normalizePhone(obj['手機號碼'] || obj['phone'] || '');
            let region = String(obj['區域'] || obj['region'] || '').trim();
            const address = String(obj['地址'] || obj['address'] || '').trim();
            const reason = String(obj['事由'] || obj['reason'] || '').trim();

            if (position && !POSITION_OPTIONS.includes(position)) errors.push(`第 ${idx} 列：職稱「${position}」非有效選項`);
            if (birth && !/^\d{4}-\d{2}-\d{2}$/.test(birth)) errors.push(`第 ${idx} 列：出生年月日格式需為 YYYY-MM-DD`);
            if (idNumber && !isValidTwId(idNumber)) errors.push(`第 ${idx} 列：身分證號格式錯誤`);
            if (phone && !/^09\d{8}$/.test(phone)) errors.push(`第 ${idx} 列：手機號碼格式錯誤`);
            if (!region && address) {
                if (/台北市|臺北市/.test(address)) region = '台北';
                else if (/新北市/.test(address)) region = '新北';
                else if (/桃園市|桃園縣/.test(address)) region = '桃園';
                else {
                    for (const r of REGION_OPTIONS) {
                        if (address.startsWith(r) || address.includes(r + '市') || address.includes(r + '縣')) {
                            region = r; break;
                        }
                    }
                }
            }
            if (region && !REGION_OPTIONS.includes(region)) errors.push(`第 ${idx} 列：區域「${region}」非有效選項`);

            if (errors.length > 0) return { error: errors.join('；') };
            return {
                data: {
                    createdAt: createdDate,
                    position,
                    name,
                    birth: /^\d{4}-\d{2}-\d{2}$/.test(birth) ? birth : '',
                    idNumber,
                    phone,
                    region,
                    address,
                    reason,
                    photo: ''
                }
            };
        }

        async function importExcel(event) {
            const file = event && event.target && event.target.files && event.target.files[0];
            if (!file) return;
            if (!rootRef) {
                alert('系統尚未就緒，請稍後再試。');
                event.target.value = '';
                return;
            }
            if (typeof XLSX === 'undefined') {
                alert('Excel 匯入模組尚未載入完成，請稍後再試。');
                event.target.value = '';
                return;
            }
            const confirmMsg = `即將匯入 Excel 檔案「${file.name}」。\n\n匯入的資料會以【新增】方式寫入黑名單，不會覆蓋既有資料。\n請問是否繼續？`;
            if (!confirm(confirmMsg)) {
                event.target.value = '';
                return;
            }
            try {
                const buf = await file.arrayBuffer();
                const wb = XLSX.read(buf, { type: 'array', cellDates: true });
                const sheetName = wb.SheetNames[0];
                const ws = wb.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
                if (!rows || rows.length === 0) {
                    alert('檔案中沒有可讀取的資料列。');
                    event.target.value = '';
                    return;
                }
                const validList = [];
                const errorList = [];
                rows.forEach((row, i) => {
                    const result = validateImportRow(row, i + 2);
                    if (result.error) errorList.push(result.error);
                    else validList.push(result.data);
                });
                if (errorList.length > 0) {
                    alert(`以下欄位驗證失敗，已跳過：\n\n${errorList.slice(0, 30).join('\n')}${errorList.length > 30 ? `\n…其餘 ${errorList.length - 30} 筆省略` : ''}`);
                }
                if (validList.length === 0) {
                    alert('沒有可匯入的有效資料。');
                    event.target.value = '';
                    return;
                }
                const proceedOk = confirm(`共 ${validList.length} 筆有效資料，即將開始匯入。是否繼續？`);
                if (!proceedOk) {
                    event.target.value = '';
                    return;
                }
                const now = new Date();
                let successCount = 0;
                let failCount = 0;
                const errors = [];
                for (let i = 0; i < validList.length; i++) {
                    const item = validList[i];
                    try {
                        await rootRef.add({
                            createdAt: firebase.firestore.Timestamp.fromDate(item.createdAt),
                            position: item.position,
                            name: item.name,
                            birth: item.birth,
                            idNumber: item.idNumber,
                            phone: item.phone,
                            region: item.region,
                            address: item.address,
                            reason: item.reason,
                            photo: '',
                            createdBy: currentUid || null,
                            updatedAt: firebase.firestore.Timestamp.fromDate(new Date())
                        });
                        successCount++;
                    } catch (e) {
                        failCount++;
                        errors.push(`第 ${i + 1} 筆（${item.name}）：${(e && e.message) || '寫入失敗'}`);
                    }
                }
                const summary = `匯入完成！\n\n成功：${successCount} 筆\n失敗：${failCount} 筆${errors.length ? '\n\n失敗明細（前 20 筆）：\n' + errors.slice(0, 20).join('\n') : ''}`;
                alert(summary);
            } catch (e) {
                alert(`匯入失敗：${(e && e.message) || '未知錯誤'}`);
            } finally {
                event.target.value = '';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCustomReasons();
            rebuildReasonSelect('');
            lucide.createIcons();
            bootstrap();
        });
    </script>
</body>
