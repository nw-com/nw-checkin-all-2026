<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西北公司內部出勤</title>
    <meta name="description" content="西北公司內部出勤（分享連結 24 小時有效）。">
    <meta property="og:title" content="西北公司內部出勤">
    <meta property="og:description" content="西北公司內部出勤（分享連結 24 小時有效）。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f8fafc; }
        .lead-app { height: calc(var(--vh, 1vh) * 100); }
        .img-zoom-stage {
            position: relative;
            width: 100%;
            max-height: 75vh;
            min-height: 40vh;
            overflow: hidden;
            background: #000;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
        }
        .img-zoom-stage.is-grabbing { cursor: grabbing; }
        .img-zoom-target {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
            max-width: none;
            will-change: transform;
            pointer-events: none;
            -webkit-transform: translate3d(0,0,0) scale(1);
        }
    </style>
</head>
<body class="min-h-screen text-gray-800">
    <div class="lead-app min-h-screen h-screen h-[100svh] h-[100dvh] grid grid-rows-[8%_14%_70%_8%]">
        <header class="bg-white border-b border-gray-100 shadow-sm">
            <div class="max-w-4xl mx-auto px-4 h-full flex items-center">
                <div class="w-full flex items-center gap-3">
                    <div class="flex items-center gap-2 text-red-600 text-xl md:text-2xl font-normal min-w-0">
                        <img src="./logo.svg" class="w-7 h-7" alt="系統 LOGO" />
                        <span class="truncate">西北公司內部出勤</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="bg-slate-50 overflow-hidden">
            <div class="max-w-4xl mx-auto px-4 py-2 h-full">
                <section class="bg-white rounded-2xl border border-gray-100 shadow-sm p-2 h-full flex flex-col gap-1">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <button id="company-tp-btn" type="button" class="px-3 py-1.5 rounded-xl font-black text-xs bg-gray-100 text-gray-700">台北</button>
                            <button id="company-ty-btn" type="button" class="px-3 py-1.5 rounded-xl font-black text-xs bg-gray-100 text-gray-700">桃園</button>
                        </div>
                        <div class="text-xs text-gray-400 whitespace-nowrap">
                            共 <span id="summary-count" class="font-black text-gray-700">0</span> 筆
                        </div>
                    </div>

                    <div class="grid grid-cols-[1fr_auto] items-center gap-2">
                        <div class="min-w-0">
                            <label for="user-select" class="sr-only">帳號</label>
                            <select id="user-select" class="w-full rounded-xl border border-gray-200 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-red-500 bg-white">
                                <option value="">全部帳號</option>
                            </select>
                        </div>

                        <div class="flex items-center gap-1 flex-shrink-0 whitespace-nowrap">
                            <div id="month-controls" class="flex items-center gap-1">
                                <button id="prev-month-btn" class="p-1 rounded-full hover:bg-gray-100 text-gray-500">
                                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                                </button>
                                <div class="relative">
                                    <button id="month-display" type="button" class="font-black text-gray-800 text-sm hover:underline"></button>
                                    <input id="month-input" type="month" class="absolute -left-[9999px] w-px h-px opacity-0" tabindex="-1" aria-hidden="true" />
                                </div>
                                <button id="next-month-btn" class="p-1 rounded-full hover:bg-gray-100 text-gray-500">
                                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </button>
                            </div>

                            <div id="date-controls" class="hidden items-center gap-1">
                                <button id="prev-date-btn" class="p-1 rounded-full hover:bg-gray-100 text-gray-500">
                                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                                </button>
                                <div class="relative">
                                    <button id="date-display" type="button" class="font-black text-gray-800 text-sm hover:underline"></button>
                                    <input id="date-input" type="date" class="absolute -left-[9999px] w-px h-px opacity-0" tabindex="-1" aria-hidden="true" />
                                </div>
                                <button id="next-date-btn" class="p-1 rounded-full hover:bg-gray-100 text-gray-500">
                                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <main class="overflow-y-auto">
            <div class="max-w-4xl mx-auto px-4 py-4 space-y-4">
                <div class="sticky top-0 z-20 bg-slate-50 pt-0">
                    <div id="leave-review-bar" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-2">
                        <div class="grid grid-cols-2 gap-2">
                            <button id="review-pending-btn" type="button" class="w-full px-3 py-1 rounded-xl font-black text-xs bg-gray-100 text-gray-700">待審核</button>
                            <button id="review-reviewed-btn" type="button" class="w-full px-3 py-1 rounded-xl font-black text-xs bg-gray-100 text-gray-700">已審核</button>
                        </div>
                    </div>

                    <div id="attendance-check-bar" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm p-2">
                        <div class="grid grid-cols-2 gap-2">
                            <button id="attendance-missing-btn" type="button" class="w-full px-3 py-1 rounded-xl font-black text-xs bg-gray-100 text-gray-700">未出勤</button>
                            <button id="attendance-checked-btn" type="button" class="w-full px-3 py-1 rounded-xl font-black text-xs bg-gray-100 text-gray-700">已出勤</button>
                        </div>
                    </div>
                </div>
                <section id="auth-warning" class="hidden bg-yellow-50 border border-yellow-200 text-yellow-800 rounded-2xl p-4"></section>
                <section id="error-box" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-2xl p-4"></section>

                <section id="leave-panel" class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                    <div id="loading-box" class="p-8 text-center text-gray-400">
                        <div class="w-10 h-10 border-4 border-red-100 border-t-red-600 rounded-full animate-spin mx-auto mb-3"></div>
                        <p class="font-bold">正在讀取請假資料...</p>
                    </div>
                    <div id="empty-box" class="hidden p-8 text-center text-gray-400">
                        <i data-lucide="database" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
                        <p class="font-bold">目前沒有符合條件的請假資料</p>
                    </div>
                    <div id="leave-list" class="hidden p-4 space-y-3 pb-6"></div>
                </section>

                <section id="attendance-panel" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                    <div id="attendance-loading" class="p-8 text-center text-gray-400">
                        <div class="w-10 h-10 border-4 border-red-100 border-t-red-600 rounded-full animate-spin mx-auto mb-3"></div>
                        <p class="font-bold">正在讀取出勤資料...</p>
                    </div>
                    <div id="attendance-empty" class="hidden p-8 text-center text-gray-400">
                        <i data-lucide="database" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
                        <p id="attendance-empty-text" class="font-bold">目前沒有符合條件的出勤資料</p>
                    </div>
                    <div id="attendance-list" class="hidden p-4 space-y-3 pb-6"></div>
                </section>
            </div>
        </main>

        <footer class="bg-white border-t border-gray-100 pb-[env(safe-area-inset-bottom)]">
            <div class="max-w-4xl mx-auto px-3 h-full flex items-center pb-2">
                <div class="w-full grid grid-cols-2 gap-2">
                    <button id="tab-attendance" type="button" class="relative h-10 rounded-xl bg-gray-100 text-gray-700 font-black flex items-center justify-center gap-2">
                        <i data-lucide="clipboard-check" class="w-4 h-4"></i>
                        <span>出勤</span>
                        <span id="tab-attendance-badge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-600 text-white text-[10px] font-black flex items-center justify-center"></span>
                    </button>
                    <button id="tab-leave" type="button" class="relative h-10 rounded-xl bg-red-600 text-white font-black flex items-center justify-center gap-2">
                        <i data-lucide="calendar-check" class="w-4 h-4"></i>
                        <span>請假</span>
                        <span id="tab-leave-badge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-600 text-white text-[10px] font-black flex items-center justify-center"></span>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <div id="image-modal" class="hidden fixed inset-0 bg-black/70 z-50 items-center justify-center p-4">
        <div class="max-w-3xl w-full">
            <div class="flex flex-wrap justify-between items-center mb-2 gap-2">
                <div class="flex items-center gap-1 flex-wrap">
                    <button id="img-zoom-out-btn" class="px-3 py-2 rounded-xl bg-white/90 text-gray-800 font-black hover:bg-white transition-colors" type="button">－</button>
                    <button id="img-zoom-reset-btn" class="px-3 py-2 rounded-xl bg-white/90 text-gray-800 font-black hover:bg-white transition-colors text-xs" type="button">100%</button>
                    <button id="img-zoom-in-btn" class="px-3 py-2 rounded-xl bg-white/90 text-gray-800 font-black hover:bg-white transition-colors" type="button">＋</button>
                    <button id="img-download-btn" class="px-3 py-2 rounded-xl bg-emerald-600 text-white font-black hover:bg-emerald-700 transition-colors text-xs flex items-center gap-1" type="button">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span>下載圖片</span>
                    </button>
                </div>
                <button id="close-image-btn" class="px-3 py-2 rounded-xl bg-white/90 text-gray-800 font-black hover:bg-white transition-colors" type="button">關閉</button>
            </div>
            <div id="img-zoom-stage" class="img-zoom-stage bg-black rounded-2xl overflow-hidden border border-gray-200 shadow-2xl">
                <img id="image-modal-img" class="img-zoom-target bg-black" alt="請假照片預覽" />
            </div>
        </div>
    </div>

    <script>
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-attendance-app';
        const state = {
            authUser: null,
            dbUser: null,
            roles: [],
            users: [],
            leaves: [],
            attendance: [],
            schedules: [],
            shareCode: '',
            shareValid: false,
            shareReviewerName: '',
            shareExpiresAt: null,
            shareLeavesLoaded: false,
            attemptedAnonymousSignIn: false,
            reviewMode: 'pending',
            updatingLeaveId: '',
            pageTab: 'leave',
            attendanceMode: 'missing',
            attendanceDate: '',
            companyId: '',
            userId: '',
            month: ''
        };

        const inTypes = new Set(['in', 'work_in', 'duty_in', 'late_in', 'card_in']);
        const outTypes = new Set(['out', 'work_out', 'duty_out', 'late_out', 'card_out']);

        const nationalHolidays = new Set([
            '2025-01-01','2025-01-25','2025-01-26','2025-01-27','2025-01-28','2025-01-29','2025-01-30','2025-01-31','2025-02-01','2025-02-02',
            '2025-02-28','2025-04-03','2025-04-04','2025-04-05','2025-04-06','2025-05-01','2025-05-30','2025-05-31','2025-06-01',
            '2025-10-04','2025-10-05','2025-10-06','2025-10-10','2025-10-11','2025-10-12','2025-12-25',
            '2026-01-01','2026-01-02','2026-02-14','2026-02-15','2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20','2026-02-21','2026-02-22',
            '2026-02-27','2026-02-28','2026-03-01','2026-04-03','2026-04-04','2026-04-05','2026-04-06','2026-05-01',
            '2026-06-19','2026-06-20','2026-06-21','2026-09-25','2026-09-26','2026-09-27','2026-10-09','2026-10-10','2026-10-11','2026-12-25'
        ]);

        const $ = (id) => document.getElementById(id);

        function setError(message = '') {
            const box = $('error-box');
            if (!message) {
                box.classList.add('hidden');
                box.textContent = '';
                return;
            }
            box.textContent = message;
            box.classList.remove('hidden');
        }

        function setAuthWarning(message = '') {
            const box = $('auth-warning');
            if (!message) {
                box.classList.add('hidden');
                box.textContent = '';
                return;
            }
            box.textContent = message;
            box.classList.remove('hidden');
        }

        function getShareCodeFromUrl() {
            try {
                const params = new URLSearchParams(window.location.search || '');
                return safeString(params.get('share'));
            } catch (_) {
                return '';
            }
        }

        async function loadShareLinkFromUrl() {
            const code = getShareCodeFromUrl();
            state.shareCode = code;
            state.shareValid = false;
            state.shareReviewerName = '';
            state.shareExpiresAt = null;
            if (!code) return;

            try {
                const snap = await db
                    .collection('artifacts')
                    .doc(appId)
                    .collection('public')
                    .doc('data')
                    .collection('share_links')
                    .doc(code)
                    .get();

                if (!snap.exists) {
                    setAuthWarning('分享連結無效或不存在。');
                    return;
                }
                const data = snap.data() || {};
                if (safeString(data.kind) !== 'data-lead') {
                    setAuthWarning('分享連結類型不正確。');
                    return;
                }
                const expiresAt = data.expiresAt?.toDate ? data.expiresAt.toDate() : null;
                if (!expiresAt || Number.isNaN(expiresAt.getTime()) || Date.now() >= expiresAt.getTime()) {
                    setAuthWarning('分享連結已過期（24 小時）。');
                    return;
                }

                state.shareValid = true;
                state.shareReviewerName = safeString(data.reviewerName);
                state.shareExpiresAt = expiresAt;
                const cid = safeString(data.companyId);
                if (cid) {
                    state.companyId = normalizeCompanyId(cid);
                    localStorage.setItem('lead_leave_company', state.companyId);
                }
                setAuthWarning('');
                setPageTab('leave');
            } catch (e) {
                setAuthWarning(`讀取分享連結失敗：${e.message || e}`);
            }
        }

        function toYmd(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function shiftDay(ymd, delta) {
            const base = new Date(`${String(ymd || '').trim() || toYmd(new Date())}T00:00:00`);
            if (Number.isNaN(base.getTime())) return toYmd(new Date());
            base.setDate(base.getDate() + delta);
            return toYmd(base);
        }

        function monthFromYmd(ymd) {
            const v = String(ymd || '').trim();
            return /^\d{4}-\d{2}/.test(v) ? v.slice(0, 7) : '';
        }

        function shiftMonth(ymd, delta) {
            const baseStr = String(ymd || '').trim();
            const base = new Date(`${baseStr || toYmd(new Date())}T00:00:00`);
            if (Number.isNaN(base.getTime())) return toYmd(new Date());
            base.setDate(1);
            base.setMonth(base.getMonth() + delta);
            return `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, '0')}-01`;
        }

        function safeString(value, fallback = '') {
            const v = String(value || '').trim();
            return v || fallback;
        }

        function normalizeCompanyId(value) {
            const v = safeString(value);
            if (!v) return '';
            const upper = v.toUpperCase();
            if (upper === 'TP') return 'TP';
            if (upper === 'TY') return 'TY';
            if (v.includes('台北')) return 'TP';
            if (v.includes('桃園')) return 'TY';
            return v;
        }

        function toTelHref(phone) {
            const raw = safeString(phone);
            if (!raw) return '';
            const cleaned = raw.replace(/[^\d+]/g, '');
            if (!cleaned) return '';
            return `tel:${cleaned}`;
        }

        function getMobileNumber(user) {
            return safeString(user?.mobile) || safeString(user?.phone) || safeString(user?.cellphone) || safeString(user?.tel);
        }

        function el(tag, className = '', text = '') {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== '') node.textContent = text;
            return node;
        }

        function setMonthValue(ym) {
            const now = new Date();
            const todayMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const next = ym && /^\d{4}-\d{2}$/.test(ym) ? ym : todayMonth;
            state.month = next;
            $('month-display').textContent = next;
            $('month-input').value = next;
            $('next-month-btn').disabled = next === todayMonth;
            $('next-month-btn').className = `p-1 rounded-full hover:bg-gray-100 text-gray-500 ${next === todayMonth ? 'opacity-30 cursor-not-allowed' : ''}`;
            render();
            resubscribeSchedules();
        }

        function setAttendanceDateValue(ymd) {
            const now = new Date();
            const todayStr = toYmd(now);
            const next = /^\d{4}-\d{2}-\d{2}$/.test(String(ymd || '').trim()) ? String(ymd).trim() : todayStr;
            state.attendanceDate = next;
            $('date-display').textContent = next;
            $('date-input').value = next;
            const isToday = next === todayStr;
            $('next-date-btn').disabled = isToday;
            $('next-date-btn').className = `p-1 rounded-full hover:bg-gray-100 text-gray-500 ${isToday ? 'opacity-30 cursor-not-allowed' : ''}`;
            render();
        }

        function openMonthPicker() {
            const input = $('month-input');
            if (!input) return;
            if (typeof input.showPicker === 'function') {
                input.showPicker();
                return;
            }
            input.click();
        }

        function openDatePicker() {
            const input = $('date-input');
            if (!input) return;
            if (typeof input.showPicker === 'function') {
                input.showPicker();
                return;
            }
            input.click();
        }

        function isAnonymousAuthUser(user) {
            return !!user && user.isAnonymous === true;
        }

        function isAllowedAccount(u) {
            const status = safeString(u?.status, '在職');
            if (status !== '在職') return false;
            const role = safeString(u?.role);
            if (!role) return false;
            const allowedRoleIds = new Set(['admin', 'hr', 'manager', 'property', 'cadre', 'staff']);
            const roleNameById = new Map((state.roles || []).map(r => [String(r.id || ''), safeString(r.name)]));
            const roleLabel = roleNameById.get(role) || role;
            return allowedRoleIds.has(role) || /(系統管理員|人事|物業|管理層|幹部|員工)/.test(roleLabel);
        }

        function isActiveEmployee(u) {
            return safeString(u?.status, '在職') === '在職';
        }

        function isAttendanceUser(u) {
            if (!isActiveEmployee(u)) return false;

            const roleId = safeString(u?.role);
            const roleMap = {
                admin: '系統管理員',
                manager: '管理層',
                hr: '人事',
                cadre: '幹部',
                staff: '員工',
                secretary: '秘書',
                cleaner: '清潔',
                mechanic: '機電',
                guard: '保全',
                property: '物業',
                temp_guard: '臨時保全'
            };
            const roleNameById = new Map((state.roles || []).map(r => [String(r.id || ''), safeString(r.name)]));
            const roleName = safeString(u?.roleName) || roleNameById.get(roleId) || roleMap[roleId] || roleId;

            const title = safeString(u?.title);
            const blockedPattern = /(總幹事|保全|管理層|秘書|清潔|機電|臨時保全)/;
            const blockedRoleIds = new Set([
                'manager',
                'gm',
                'secretary',
                'clean',
                'cleaner',
                'mech',
                'mechanic',
                'guard',
                'dayGuard',
                'nightGuard',
                'temp_guard',
                'tempGuard'
            ]);
            if (blockedRoleIds.has(roleId)) return false;
            if (blockedPattern.test(roleId) || blockedPattern.test(roleName) || blockedPattern.test(title)) return false;
            return true;
        }

        function buildUserOptions() {
            const select = $('user-select');
            const current = select.value;
            while (select.options.length > 1) select.remove(1);
            const filteredUsers = (state.pageTab === 'attendance'
                ? getCompanyUsers().filter(isAttendanceUser)
                : (state.shareValid && !state.authUser
                    ? getCompanyUsers()
                    : getCompanyUsers().filter(isAllowedAccount)
                )
            );
            filteredUsers
                .slice()
                .sort((a, b) => safeString(a.name).localeCompare(safeString(b.name), 'zh-Hant'))
                .forEach((u) => {
                    const opt = document.createElement('option');
                    opt.value = String(u.id || '');
                    opt.textContent = safeString(u.name || u.email || u.phone || u.id, '(未命名)');
                    select.appendChild(opt);
                });
            if (current && filteredUsers.some(u => String(u.id) === String(current))) {
                select.value = current;
            } else if (state.userId && filteredUsers.some(u => String(u.id) === String(state.userId))) {
                select.value = state.userId;
            } else {
                select.value = '';
                state.userId = '';
            }
        }

        function getCompanyUsers() {
            const users = state.users || [];
            const companyId = normalizeCompanyId(state.companyId);
            if (!companyId) return users;
            return users.filter((u) => {
                const rawCompanyIds = Array.isArray(u.companyIds) ? u.companyIds : [];
                const normalizedCompanyIds = rawCompanyIds.map(normalizeCompanyId).filter(Boolean);
                const normalizedMain = normalizeCompanyId(u.companyId);
                return normalizedCompanyIds.includes(companyId) || normalizedMain === companyId;
            });
        }

        function setCompanyFilter(companyId) {
            state.companyId = safeString(companyId);

        function getRecordMonth(record) {
            const dateStr = safeString(record?.leaveStartDate).split('T')[0] ||
                safeString(record?.leaveDate) ||
                '';
            if (dateStr && /^\d{4}-\d{2}-\d{2}/.test(dateStr)) return dateStr.slice(0, 7);
            const seconds = record?.timestamp?.seconds || 0;
            if (!seconds) return '';
            return monthFromYmd(toYmd(new Date(seconds * 1000)));
        }

        function buildFilteredLeaves() {
            const companyUserIds = getCompanyUserIds();
            const month = state.month;
            return (state.leaves || [])
                .filter((r) => {
                    const ap = safeString(r?.approvalStatus, 'pending');
                    if (state.reviewMode === 'pending') {
                        if (ap !== 'pending') return false;
                    } else {
                        if (ap === 'pending') return false;
                    }
                    if (state.companyId && !companyUserIds.has(String(r.userId || ''))) return false;
                    if (state.userId && String(r.userId || '') !== String(state.userId)) return false;
                    if (state.reviewMode === 'pending') return true;
                    if (!month) return true;
                    return getRecordMonth(r) === month;
                })
                .slice()
                .sort((a, b) => {
                    const ap = safeString(a.approvalStatus);
                    const bp = safeString(b.approvalStatus);
                    if (ap === 'pending' && bp !== 'pending') return -1;
                    if (ap !== 'pending' && bp === 'pending') return 1;
                    const da = safeString(a.leaveStartDate || a.leaveDate);
                    const db = safeString(b.leaveStartDate || b.leaveDate);
                    return db.localeCompare(da);
                });
        }

        function formatApplyDate(record) {
            const seconds = record?.timestamp?.seconds || 0;
            const date = seconds ? new Date(seconds * 1000) : new Date();
            return new Intl.DateTimeFormat('zh-TW', {
                timeZone: 'Asia/Taipei',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false
            }).format(date).replace(/\//g, '/');
        }

        function parseLocalDateTime(str) {
            const raw = safeString(str);
            if (!raw) return null;
            const parts = raw.split(/[T ]/);
            if (parts.length < 2) return null;
            const dStr = parts[0];
            const tStr = parts[1];
            const [y, m, d] = dStr.split('-').map(Number);
            const [hh, mm, ss] = tStr.split(':').map(Number);
            const date = new Date(y, (m || 1) - 1, d || 1, hh || 0, mm || 0, ss || 0);
            if (Number.isNaN(date.getTime())) return null;
            return date;
        }

        function ensureTimeRange(record) {
            const leaveDate = safeString(record?.leaveDate);
            if (!leaveDate) return { start: null, end: null };
            let sTime = safeString(record?.leaveTime);
            let eTime = safeString(record?.leaveEndTime);
            if (sTime.includes('~') && !eTime) {
                const parts = sTime.split('~').map(v => safeString(v));
                sTime = parts[0] || '';
                eTime = parts[1] || '';
            }
            if (!sTime || !eTime) return { start: null, end: null };
            const [y, m, d] = leaveDate.split('-').map(Number);
            const [sh, sm] = sTime.split(':').map(Number);
            const [eh, em] = eTime.split(':').map(Number);
            const start = new Date(y, (m || 1) - 1, d || 1, sh || 0, sm || 0, 0);
            const end = new Date(y, (m || 1) - 1, d || 1, eh || 0, em || 0, 0);
            if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return { start: null, end: null };
            return { start, end };
        }

        function buildLeaveDates(record) {
            const startStr = safeString(record?.leaveStartDate).split('T')[0];
            const endStr = safeString(record?.leaveEndDate).split('T')[0];
            const single = safeString(record?.leaveDate);
            const dates = [];
            if (startStr && endStr) {
                const s = new Date(`${startStr}T00:00:00`);
                const e = new Date(`${endStr}T00:00:00`);
                if (Number.isNaN(s.getTime()) || Number.isNaN(e.getTime())) return dates;
                for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
                    dates.push(toYmd(d));
                }
                return dates;
            }
            if (single) return [single];
            return dates;
        }

        function formatHhMm(date) {
            return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function getScheduleFor(userId, dateStr) {
            const uid = String(userId || '');
            const day = String(dateStr || '');
            return (state.schedules || []).find(s => String(s.userId || '') === uid && String(s.date || '') === day) || null;
        }

        function calcLeaveBreakdown(record) {
            const dates = buildLeaveDates(record);
            if (!dates.length) return null;

            let leaveStart = null;
            let leaveEnd = null;
            if (safeString(record?.leaveStartDate) && safeString(record?.leaveEndDate)) {
                leaveStart = parseLocalDateTime(record.leaveStartDate);
                leaveEnd = parseLocalDateTime(record.leaveEndDate);
            } else {
                const range = ensureTimeRange(record);
                leaveStart = range.start;
                leaveEnd = range.end;
            }

            let totalDays = 0;
            let totalHours = 0;
            const items = [];

            dates.forEach((dateStr) => {
                const schedule = getScheduleFor(record?.userId, dateStr);
                let type = 'work';
                let hours = 0;
                let timeRangeStr = '';

                if (schedule) {
                    type = safeString(schedule.type, 'work');
                    if (['work', 'duty', 'card'].includes(type) && safeString(schedule.startTime) && safeString(schedule.endTime)) {
                        const [sH, sM] = safeString(schedule.startTime).split(':').map(Number);
                        const [eH, eM] = safeString(schedule.endTime).split(':').map(Number);
                        const [dy, dm, dd] = dateStr.split('-').map(Number);
                        const sDate = new Date(dy, (dm || 1) - 1, dd || 1, sH || 0, sM || 0, 0);
                        const eDate = new Date(dy, (dm || 1) - 1, dd || 1, eH || 0, eM || 0, 0);
                        if (eDate < sDate) eDate.setDate(eDate.getDate() + 1);

                        if (leaveStart && leaveEnd) {
                            const overlapStart = new Date(Math.max(sDate.getTime(), leaveStart.getTime()));
                            const overlapEnd = new Date(Math.min(eDate.getTime(), leaveEnd.getTime()));
                            if (overlapEnd > overlapStart) {
                                hours = (overlapEnd - overlapStart) / (1000 * 60 * 60);
                                timeRangeStr = `${formatHhMm(overlapStart)}~${formatHhMm(overlapEnd)}`;
                            } else {
                                hours = 0;
                            }
                        }
                    }
                } else {
                    if (nationalHolidays.has(dateStr)) type = 'holiday';
                    else {
                        const w = new Date(`${dateStr}T00:00:00`).getDay();
                        if (w === 0 || w === 6) type = 'holiday';
                        else if (w === 5) type = 'off';
                        else type = 'work';
                    }
                }

                if (type === 'off' || type === 'holiday') return;
                if (hours <= 0) return;

                totalDays += 1;
                totalHours += hours;
                items.push({ dateStr, hours, timeRangeStr });
            });

            if (!items.length) return null;
            return { items, totalDays, totalHours };
        }

        function statusLabel(status) {
            const v = safeString(status);
            if (v === 'approved') return '已核准';
            if (v === 'rejected') return '已駁回';
            return '待核准';
        }

        function statusClass(status) {
            const v = safeString(status);
            if (v === 'approved') return 'bg-green-100 text-green-700';
            if (v === 'rejected') return 'bg-red-100 text-red-700';
            return 'bg-orange-100 text-orange-700';
        }

        function canReviewLeaveByShare() {
            return state.shareValid === true && !!state.shareCode;
        }

        function canReviewLeaveByRole() {
            const u = state.dbUser;
            if (!u) return false;
            const roleId = safeString(u.role);
            if (['admin', 'hr', 'manager', 'cadre'].includes(roleId)) return true;
            const roleNameById = new Map((state.roles || []).map(r => [String(r.id || ''), safeString(r.name)]));
            const roleLabel = roleNameById.get(roleId) || roleId;
            return /(系統管理員|人事|物業|幹部)/.test(roleLabel);
        }

        function canReviewLeave() {
            return canReviewLeaveByShare() || canReviewLeaveByRole();
        }

        function applyLocalLeaveStatus(leaveId, status, approverName = '') {
            const id = String(leaveId || '').trim();
            if (!id) return;
            const list = Array.isArray(state.leaves) ? state.leaves : [];
            const idx = list.findIndex(x => String(x?.id || '').trim() === id);
            if (idx < 0) return;
            const next = { ...(list[idx] || {}) };
            next.approvalStatus = status;
            next.approverName = approverName || next.approverName;
            next.approvalTime = new Date();
            list[idx] = next;
            state.leaves = list;
        }

        async function updateLeaveStatus(status, record) {
            if (!record || !record.id) return;
            if (!canReviewLeave()) return;

            const label = status === 'approved' ? '核准' : '拒絕';
            const reason = safeString(record.leaveReason, '未填寫');
            const start = safeString(record.leaveStartDate);
            const end = safeString(record.leaveEndDate);
            const desc = safeString(record.leaveDescription, '無');
            const msg = `確定要${label}此請假申請？\n事由: ${reason}\n期間: ${start} ~ ${end}\n說明: ${desc}`;
            if (!window.confirm(msg)) return;

            try {
                state.updatingLeaveId = String(record.id);
                render();
                const byShare = canReviewLeaveByShare() && !state.dbUser;
                const payload = {
                    approvalStatus: status,
                    approvalTime: firebase.firestore.FieldValue.serverTimestamp(),
                    approverId: byShare ? 'guest-link' : state.dbUser?.id,
                    approverName: byShare ? (state.shareReviewerName || '連結審核') : (state.dbUser?.name || state.dbUser?.email || '')
                };
                if (byShare) payload.verificationToken = state.shareCode;
                await db
                    .collection('artifacts')
                    .doc(appId)
                    .collection('public')
                    .doc('data')
                    .collection('leaves')
                    .doc(String(record.id))
                    .update(payload);

                applyLocalLeaveStatus(record.id, status, payload.approverName);

                if (byShare) {
                    await db
                        .collection('artifacts')
                        .doc(appId)
                        .collection('public')
                        .doc('data')
                        .collection('share_links')
                        .doc(String(state.shareCode))
                        .collection('leaves')
                        .doc(String(record.id))
                        .update({
                            approvalStatus: status,
                            approvalTime: firebase.firestore.FieldValue.serverTimestamp(),
                            approverId: payload.approverId,
                            approverName: payload.approverName,
                            verificationToken: state.shareCode
                        });
                }
            } catch (e) {
                setError(`更新失敗：${e.message || e}`);
            } finally {
                state.updatingLeaveId = '';
                render();
            }
        }

        function buildCard(record) {

            } else {

            }

            const breakdown = calcLeaveBreakdown(record);
            if (breakdown) {

                wrap.appendChild(el('div', 'font-bold text-red-600 mb-1', '實際請假日期'));
                breakdown.items.forEach((it) => {
                    const row = el('div', 'flex items-center gap-2');

                    row.appendChild(el('span', '', `${it.hours.toFixed(1)} hr`));
                    if (it.timeRangeStr) row.appendChild(el('span', 'text-red-600 text-[11px]', `(${it.timeRangeStr})`));
                    wrap.appendChild(row);
                });
                wrap.appendChild(el('div', 'border-t border-gray-200 mt-2 pt-1 font-bold text-red-600', `總天數及總工時 : 共 ${breakdown.totalDays} 天, ${breakdown.totalHours.toFixed(1)} hr`));
                period.appendChild(wrap);
            }

            root.appendChild(period);

            const leaveDescription = safeString(record.leaveDescription);
            if (leaveDescription) {
                root.appendChild(el('div', 'bg-gray-50 p-3 rounded-lg text-sm text-red-600 mb-4 whitespace-pre-wrap', leaveDescription));
            }

            const photoUrl = safeString(record.photoUrl);
            if (photoUrl) {

                photoWrap.addEventListener('click', () => openImageModal(photoUrl));
                root.appendChild(photoWrap);
            }

            const ap = safeString(record.approvalStatus, 'pending');
            if (ap === 'pending' && canReviewLeave()) {
                const busy = String(state.updatingLeaveId || '') === String(record.id || '');
                const row = el('div', 'flex gap-3 border-t border-gray-100 pt-3');
                const rejectBtn = el('button', 'flex-1 py-2 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm font-black hover:bg-red-100 transition-colors', '拒絕');
                const approveBtn = el('button', 'flex-1 py-2 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm font-black hover:bg-green-100 transition-colors', '核准');
                rejectBtn.disabled = busy;
                approveBtn.disabled = busy;
                if (busy) {
                    rejectBtn.className += ' opacity-50 cursor-not-allowed';
                    approveBtn.className += ' opacity-50 cursor-not-allowed';
                }
                rejectBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    updateLeaveStatus('rejected', record);
                });
                approveBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    updateLeaveStatus('approved', record);
                });
                row.appendChild(rejectBtn);
                row.appendChild(approveBtn);
                root.appendChild(row);
            }

            return root;
        }

        function getRecordDateObj(record) {
            const seconds = record?.timestamp?.seconds || record?.createdAt?.seconds || 0;
            if (!seconds) return null;
            const d = new Date(seconds * 1000);
            return Number.isNaN(d.getTime()) ? null : d;
        }

        function getRecordLogicDateStr(record) {
            const logicDate = safeString(record?.logicDate);
            if (logicDate && /^\d{4}-\d{2}-\d{2}$/.test(logicDate)) return logicDate;
            const date = getRecordDateObj(record);
            if (!date) return '';
            const shift = safeString(record?.shift) === 'night' ? 'night' : (record?.isNightShift === true ? 'night' : 'day');
            if (shift === 'night' && date.getHours() < 12) {
                return toYmd(new Date(date.getTime() - 24 * 60 * 60 * 1000));
            }
            return toYmd(date);
        }

        function formatTimeOnly(date) {
            if (!(date instanceof Date) || Number.isNaN(date.getTime())) return '-';
            return date.toLocaleTimeString('zh-TW', {
                timeZone: 'Asia/Taipei',

        function buildAttendanceView() {
            const dateStr = safeString(state.attendanceDate);
            const all = state.attendance || [];
            const inByUserId = new Map();
            const outByUserId = new Map();

            const updateLatest = (map, uid, record) => {
                const prev = map.get(uid);
                if (!prev) {
                    map.set(uid, record);
                    return;
                }
                const pD = getRecordDateObj(prev);
                const nD = getRecordDateObj(record);
                if (!pD || !nD) return;
                if (nD.getTime() > pD.getTime()) map.set(uid, record);
            };

            all.forEach((r) => {
                if (getRecordLogicDateStr(r) !== dateStr) return;
                const uid = safeString(r?.userId);
                if (!uid) return;
                const t = safeString(r?.type);
                if (inTypes.has(t)) updateLatest(inByUserId, uid, r);
                if (outTypes.has(t)) updateLatest(outByUserId, uid, r);
            });

            const baseUsers = getCompanyUsers().filter(isAttendanceUser);
            const users = state.userId
                ? baseUsers.filter(u => String(u.id || '') === String(state.userId))
                : baseUsers;

            const missing = [];
            const checked = [];
            users.forEach((u) => {
                const uid = String(u.id || '');
                const inRecord = inByUserId.get(uid) || null;
                const outRecord = outByUserId.get(uid) || null;
                if (inRecord) checked.push({ user: u, inRecord, outRecord });
                else missing.push({ user: u, inRecord: null, outRecord });
            });

            missing.sort((a, b) => safeString(a.user?.name).localeCompare(safeString(b.user?.name), 'zh-Hant'));
            checked.sort((a, b) => safeString(a.user?.name).localeCompare(safeString(b.user?.name), 'zh-Hant'));

            return { missing, checked };
        }

        function openImageModal(url) {
            const img = $('image-modal-img');
            img.style.maxWidth = 'none';
            img.style.maxHeight = 'none';
            img.style.width = '';
            img.style.height = '';
            img.style.transform = 'translate(-50%, -50%) scale(0.01)';
            img.style.opacity = '0';
            img.crossOrigin = 'anonymous';
            img.src = url;
            imgZoom.currentSrc = url;
            $('image-modal').classList.remove('hidden');
            $('image-modal').classList.add('flex');
            resetImageZoom(true);
            img.onload = () => {
                requestAnimationFrame(() => {
                    fitImageToStage();

        function closeImageModal() {
            $('image-modal').classList.add('hidden');
            $('image-modal').classList.remove('flex');
            const img = $('image-modal-img');
            img.src = '';
            img.style.opacity = '1';
            resetImageZoom(true);
        }

        const imgZoom = {
            stage: null,
            target: null,
            scale: 1,
            minScale: 1,
            maxScale: 4,
            tx: 0,
            ty: 0,
            baseRect: { w: 0, h: 0, left: 0, top: 0 },
            pointer: null,
            pinch: null,
            lastTapAt: 0,
            currentSrc: ''
        };

        function resetImageZoom(silent = false) {
            imgZoom.scale = 1;
            imgZoom.minScale = 1;
            imgZoom.maxScale = 4;
            imgZoom.tx = 0;
            imgZoom.ty = 0;
            imgZoom.pointer = null;
            imgZoom.pinch = null;
            const resetBtn = $('img-zoom-reset-btn');
            if (resetBtn) resetBtn.textContent = '100%';
            if (!silent) applyImageTransform();
        }

        function fitImageToStage() {
            const stage = imgZoom.stage || $('img-zoom-stage');
            const target = imgZoom.target || $('image-modal-img');
            if (!stage || !target) return;
            const sw = stage.clientWidth || 300;
            const sh = stage.clientHeight || 400;
            const iw = target.naturalWidth || target.width || sw;
            const ih = target.naturalHeight || target.height || sh;
            const fit = Math.min(sw / iw, sh / ih);
            const minScale = Math.max(0.2, fit || 1);
            const bw = iw * minScale;
            const bh = ih * minScale;
            imgZoom.baseRect = { w: bw, h: bh, left: 0, top: 0 };
            imgZoom.minScale = minScale;
            imgZoom.scale = minScale;
            imgZoom.tx = 0;
            imgZoom.ty = 0;
            updateZoomLabel();
        }

        function clampTranslate() {
            const stage = imgZoom.stage || $('img-zoom-stage');
            if (!stage) return;
            const sw = stage.clientWidth;
            const sh = stage.clientHeight;
            const bw = imgZoom.baseRect.w * imgZoom.scale;
            const bh = imgZoom.baseRect.h * imgZoom.scale;
            const halfSw = sw / 2;
            const halfSh = sh / 2;
            const halfBw = bw / 2;
            const halfBh = bh / 2;
            const minTx = halfBw - halfSw;
            const maxTx = halfSw - halfBw;
            const minTy = halfBh - halfSh;
            const maxTy = halfSh - halfBh;
            if (bw <= sw) {
                imgZoom.tx = 0;
            } else {
                if (imgZoom.tx < minTx) imgZoom.tx = minTx;
                if (imgZoom.tx > maxTx) imgZoom.tx = maxTx;
            }
            if (bh <= sh) {
                imgZoom.ty = 0;
            } else {
                if (imgZoom.ty < minTy) imgZoom.ty = minTy;
                if (imgZoom.ty > maxTy) imgZoom.ty = maxTy;
            }
        }

        function applyImageTransform() {
            const target = imgZoom.target || $('image-modal-img');
            if (!target) return;
            const bw = imgZoom.baseRect.w;
            const bh = imgZoom.baseRect.h;
            if (!bw || !bh) return;
            clampTranslate();
            const s = imgZoom.scale;
            const tx = imgZoom.tx;
            const ty = imgZoom.ty;
            target.style.width = `${bw}px`;
            target.style.height = `${bh}px`;
            target.style.marginLeft = `-${bw / 2}px`;
            target.style.marginTop = `-${bh / 2}px`;
            target.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${s})`;
            target.style.webkitTransform = `translate3d(${tx}px, ${ty}px, 0) scale(${s})`;
            updateZoomLabel();
        }

        function updateZoomLabel() {
            const btn = $('img-zoom-reset-btn');
            if (!btn) return;
            const base = imgZoom.minScale || 1;
            const ratio = base > 0 ? (imgZoom.scale / base) : 1;
            btn.textContent = `${Math.round(ratio * 100)}%`;
        }

        function zoomBy(factor, cx, cy) {
            const stage = imgZoom.stage || $('img-zoom-stage');
            if (!stage) return;
            const rect = stage.getBoundingClientRect();
            const px = (cx != null && cy != null) ? cx : rect.width / 2;
            const py = (cx != null && cy != null) ? cy : rect.height / 2;
            const prevScale = imgZoom.scale;
            const newScale = Math.min(imgZoom.maxScale, Math.max(imgZoom.minScale, prevScale * factor));
            if (newScale === prevScale) return;
            imgZoom.scale = newScale;
            applyImageTransform();
        }

        async function downloadCurrentImage() {
            const url = imgZoom.currentSrc || ($('image-modal-img') || {}).src || '';
            const btn = $('img-download-btn');
            if (!url) return;
            try {
                const blob = await fetchImageBlob(url);
                const ext = guessImageExt(url, blob.type);
                const name = buildImageFilename(url, ext);
                triggerBlobDownload(blob, name);
            } catch (e) {
                fallbackOpenAnchor(url);
            }
            if (btn) {
                const original = btn.innerHTML;
                btn.innerHTML = '✓ 已下載';
                setTimeout(() => { btn.innerHTML = original; lucide?.createIcons?.(); }, 1400);
            }
        }
        function fetchImageBlob(url) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.responseType = 'blob';
                xhr.withCredentials = false;
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 400 && xhr.response) resolve(xhr.response);
                    else reject(new Error('fetch-failed:' + xhr.status));
                };
                xhr.onerror = () => reject(new Error('network'));
                xhr.timeout = 30000;
                xhr.send();
            });
        }
        function guessImageExt(url, mime) {
            const t = (mime || '').toLowerCase();
            if (t.includes('image/png')) return 'png';
            if (t.includes('image/jpeg')) return 'jpg';
            if (t.includes('image/webp')) return 'webp';
            if (t.includes('image/gif')) return 'gif';
            const u = (url || '').toLowerCase();
            if (/\.png(\?|$)/.test(u)) return 'png';
            if (/\.(jpg|jpeg)(\?|$)/.test(u)) return 'jpg';
            if (/\.webp(\?|$)/.test(u)) return 'webp';
            if (/\.gif(\?|$)/.test(u)) return 'gif';
            return 'jpg';
        }
        function buildImageFilename(url, ext) {
            const ts = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const token = `${ts.getFullYear()}${pad(ts.getMonth() + 1)}${pad(ts.getDate())}-${pad(ts.getHours())}${pad(ts.getMinutes())}${pad(ts.getSeconds())}`;
            const hash = String(Math.abs((url || '').split('').reduce((a,c) => ((a << 5) - a) + c.charCodeAt(0), 0))).slice(0, 6);
            return `nw-leave-photo-${token}-${hash}.${ext}`;
        }
        function triggerBlobDownload(blob, filename) {
            const a = document.createElement('a');
            const href = URL.createObjectURL(blob);
            a.href = href;
            a.download = filename;
            a.rel = 'noopener';
            a.style.display = 'none';
            document.body.appendChild(a);
            try { a.click(); } finally {
                setTimeout(() => { URL.revokeObjectURL(href); a.remove(); }, 400);
            }
        }
        function fallbackOpenAnchor(url) {
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.style.display = 'none';
            document.body.appendChild(a);
            try { a.click(); } finally { setTimeout(() => a.remove(), 200); }
        }

        function attachImageZoomHandlers() {
            const stage = $('img-zoom-stage');
            const target = $('image-modal-img');
            if (!stage || !target) return;
            imgZoom.stage = stage;
            imgZoom.target = target;

            $('img-zoom-in-btn')?.addEventListener('click', () => zoomBy(1.2));
            $('img-zoom-out-btn')?.addEventListener('click', () => zoomBy(1 / 1.2));
            $('img-zoom-reset-btn')?.addEventListener('click', () => {
                fitImageToStage();
                applyImageTransform();
            });
            $('img-download-btn')?.addEventListener('click', () => downloadCurrentImage());

            stage.addEventListener('wheel', (e) => {
                e.preventDefault();
                const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                zoomBy(factor);
            }, { passive: false });

            stage.addEventListener('dblclick', (e) => {
                const base = imgZoom.minScale || 1;
                const ratio = base > 0 ? (imgZoom.scale / base) : 1;
                const nextFactor = ratio < 2 ? 2 / ratio : 1 / ratio;
                zoomBy(nextFactor);
            });

            stage.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                e.preventDefault();
                stage.classList.add('is-grabbing');
                imgZoom.pointer = {
                    x: e.clientX,
                    y: e.clientY,
                    tx: imgZoom.tx,
                    ty: imgZoom.ty,
                    moved: false
                };
            });
            window.addEventListener('mousemove', (e) => {
                if (!imgZoom.pointer) return;
                const dx = e.clientX - imgZoom.pointer.x;
                const dy = e.clientY - imgZoom.pointer.y;
                if (Math.abs(dx) + Math.abs(dy) > 3) imgZoom.pointer.moved = true;
                imgZoom.tx = imgZoom.pointer.tx + dx;
                imgZoom.ty = imgZoom.pointer.ty + dy;
                applyImageTransform();
            });
            window.addEventListener('mouseup', () => {
                stage.classList.remove('is-grabbing');
                imgZoom.pointer = null;
            });

            function getDistance(t1, t2) {
                const dx = t1.clientX - t2.clientX;
                const dy = t1.clientY - t2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }
            function getMidpoint(t1, t2) {
                return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
            }
            stage.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const now = Date.now();
                if (e.touches.length === 1 && now - imgZoom.lastTapAt < 300) {
                    const base = imgZoom.minScale || 1;
                    const ratio = base > 0 ? (imgZoom.scale / base) : 1;
                    const nextFactor = ratio < 2 ? 2 / ratio : 1 / ratio;
                    zoomBy(nextFactor);
                    imgZoom.lastTapAt = 0;
                    return;
                }
                if (e.touches.length === 1) imgZoom.lastTapAt = now;
                if (e.touches.length === 1) {
                    const t = e.touches[0];
                    imgZoom.pointer = {
                        x: t.clientX,
                        y: t.clientY,
                        tx: imgZoom.tx,
                        ty: imgZoom.ty,
                        moved: false
                    };
                    imgZoom.pinch = null;
                } else if (e.touches.length >= 2) {
                    const [t1, t2] = e.touches;
                    imgZoom.pinch = {
                        startDist: getDistance(t1, t2),
                        startScale: imgZoom.scale,
                        startTx: imgZoom.tx,
                        startTy: imgZoom.ty
                    };
                    imgZoom.pointer = null;
                }
            }, { passive: false });
            stage.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1 && imgZoom.pointer) {
                    const t = e.touches[0];
                    const dx = t.clientX - imgZoom.pointer.x;
                    const dy = t.clientY - imgZoom.pointer.y;
                    if (Math.abs(dx) + Math.abs(dy) > 3) imgZoom.pointer.moved = true;
                    imgZoom.tx = imgZoom.pointer.tx + dx;
                    imgZoom.ty = imgZoom.pointer.ty + dy;
                    applyImageTransform();
                } else if (e.touches.length >= 2 && imgZoom.pinch) {
                    const [t1, t2] = e.touches;
                    const dist = getDistance(t1, t2);
                    const factor = dist / imgZoom.pinch.startDist;
                    imgZoom.scale = Math.min(imgZoom.maxScale, Math.max(imgZoom.minScale, imgZoom.pinch.startScale * factor));
                    applyImageTransform();
                }
            }, { passive: false });
            stage.addEventListener('touchend', (e) => {
                if (e.touches.length === 0) {
                    imgZoom.pointer = null;
                    imgZoom.pinch = null;
                }
            });
        }

        function resubscribeSchedules() {
            if (!db || !state.authUser) return;
            if (typeof unsubSchedules === 'function') unsubSchedules();
            const month = state.month || monthFromYmd(toYmd(new Date()));
            const [y, m] = month.split('-').map(Number);
            const start = `${y}-${String(m).padStart(2, '0')}-01`;
            const lastDay = new Date(y, m, 0).getDate();
            const end = `${y}-${String(m).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

            unsubSchedules = db
                .collection('artifacts')
                .doc(appId)
                .collection('public')
                .doc('data')
                .collection('schedules')
                .where('date', '>=', start)
                .where('date', '<=', end)
                .onSnapshot((snap) => {
                    state.schedules = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    render();
                }, (e) => {
                    setError(`讀取班表失敗：${e.message || e}`);
                });
        }

        function subscribeData() {
            if (typeof unsubRoles === 'function') unsubRoles();
            if (typeof unsubUsers === 'function') unsubUsers();
            if (typeof unsubLeaves === 'function') unsubLeaves();
            if (typeof unsubAttendance === 'function') unsubAttendance();
            if (typeof unsubShareLeaves === 'function') unsubShareLeaves();

            unsubRoles = db
                .collection('artifacts')
                .doc(appId)
                .collection('public')
                .doc('data')
                .collection('roles')
                .onSnapshot((snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => (a.order || 0) - (b.order || 0));
                    state.roles = list;
                    buildUserOptions();
                    render();
                }, (e) => {
                    setError(`讀取角色資料失敗：${e.message || e}`);
                });

            unsubUsers = db
                .collection('artifacts')
                .doc(appId)
                .collection('public')
                .doc('data')
                .collection('users')
                .onSnapshot((snap) => {
                    state.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    buildUserOptions();
                    render();
                }, (e) => {
                    setError(`讀取帳號資料失敗：${e.message || e}`);
                });

            unsubLeaves = db
                .collection('artifacts')
                .doc(appId)
                .collection('public')
                .doc('data')
                .collection('leaves')
                .orderBy('timestamp', 'desc')
                .limit(2000)
                .onSnapshot((snap) => {
                    state.leaves = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    render();
                }, (e) => {
                    setError(`讀取請假資料失敗：${e.message || e}`);
                });

            state.attendanceLoaded = false;
            unsubAttendance = db
                .collection('artifacts')
                .doc(appId)
                .collection('public')
                .doc('data')
                .collection('attendance')
                .orderBy('timestamp', 'desc')
                .limit(4000)
                .onSnapshot((snap) => {
                    state.attendance = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    state.attendanceLoaded = true;
                    render();
                }, (e) => {
                    state.attendanceLoaded = true;
                    setError(`讀取出勤資料失敗：${e.message || e}`);
                    render();
                });

            resubscribeSchedules();
        }

        function subscribeShareData() {
            if (typeof unsubRoles === 'function') unsubRoles();
            if (typeof unsubUsers === 'function') unsubUsers();
            if (typeof unsubLeaves === 'function') unsubLeaves();
            if (typeof unsubAttendance === 'function') unsubAttendance();
            if (typeof unsubSchedules === 'function') unsubSchedules();
            if (typeof unsubDbUser === 'function') unsubDbUser();
            if (typeof unsubShareLeaves === 'function') unsubShareLeaves();
            if (typeof unsubShareAttendance === 'function') unsubShareAttendance();
            unsubRoles = null;
            unsubUsers = null;
            unsubLeaves = null;
            unsubAttendance = null;
            unsubSchedules = null;
            unsubDbUser = null;
            unsubShareAttendance = null;

            state.roles = [];
            state.schedules = [];
            state.attendance = [];
            state.attendanceLoaded = false;
            state.dbUser = null;
            state.shareLeavesLoaded = false;

            const code = safeString(state.shareCode);
            if (!code) return;
            $('loading-box').classList.remove('hidden');
            $('leave-list').classList.add('hidden');
            $('empty-box').classList.add('hidden');
            $('attendance-loading').classList.add('hidden');
            $('attendance-list').classList.add('hidden');
            $('attendance-empty').classList.add('hidden');

            unsubUsers = db
                .collection('artifacts')
                .doc(appId)
                .collection('public')
                .doc('data')
                .collection('users')
                .onSnapshot((snap) => {
                    state.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    buildUserOptions();
                    render();
                }, (e) => {
                    setError(`讀取帳號資料失敗：${e.message || e}`);
                });

            unsubShareLeaves = db
                .collection('artifacts')
                .doc(appId)
                .collection('public')
                .doc('data')
                .collection('share_links')
                .doc(code)
                .collection('leaves')
                .onSnapshot((snap) => {
                    state.leaves = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    state.shareLeavesLoaded = true;
                    $('loading-box').classList.add('hidden');
                    render();
                }, (e) => {
                    state.shareLeavesLoaded = true;
                    $('loading-box').classList.add('hidden');
                    setError(`讀取分享資料失敗：${e.message || e}`);
                    render();
                });

            unsubShareAttendance = db
                .collection('artifacts')
                .doc(appId)
                .collection('public')
                .doc('data')
                .collection('share_links')
                .doc(code)
                .collection('attendance')
                .orderBy('timestamp', 'desc')
                .limit(4000)
                .onSnapshot((snap) => {
                    state.attendance = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    state.attendanceLoaded = true;
                    render();
                }, (e) => {
                    state.attendanceLoaded = true;
                    setError(`讀取分享出勤資料失敗：${e.message || e}`);
                    render();
                });
        }

        async function subscribeDbUserByAuth(user) {
            if (typeof unsubDbUser === 'function') unsubDbUser();
            unsubDbUser = null;
            state.dbUser = null;
            if (!user || !user.email) return;

            try {
                const q = await db
                    .collection('artifacts')
                    .doc(appId)
                    .collection('public')
                    .doc('data')
                    .collection('users')
                    .where('email', '==', user.email)
                    .get();

                if (q.empty) return;
                const preferred = q.docs.find(d => safeString(d.data()?.status, '在職') !== '離職') || q.docs[0];
                unsubDbUser = preferred.ref.onSnapshot((snap) => {
                    if (!snap.exists) return;
                    state.dbUser = { id: snap.id, ...(snap.data() || {}) };
                    render();
                });
            } catch (e) {
                setError(`讀取登入者資料失敗：${e.message || e}`);
            }
        }

        function loadInitialState() {
            const savedCompanyId = safeString(localStorage.getItem('lead_leave_company'));
            const savedUserId = safeString(localStorage.getItem('lead_leave_user'));
            const savedMonth = safeString(localStorage.getItem('lead_leave_month'));
            const savedReviewMode = safeString(localStorage.getItem('lead_leave_review_mode'));
            const savedPageTab = safeString(localStorage.getItem('lead_page_tab'));
            const savedAttendanceMode = safeString(localStorage.getItem('lead_attendance_mode'));
            const savedAttendanceDate = safeString(localStorage.getItem('lead_attendance_date'));
            state.companyId = savedCompanyId || 'TP';
            state.userId = savedUserId;
            state.month = savedMonth;
            state.reviewMode = savedReviewMode === 'reviewed' ? 'reviewed' : 'pending';
            state.pageTab = savedPageTab === 'attendance' ? 'attendance' : 'leave';
            state.attendanceMode = savedAttendanceMode === 'checked' ? 'checked' : 'missing';
            state.attendanceDate = savedAttendanceDate;
        }

        function bindEvents() {
            $('review-pending-btn').addEventListener('click', () => setReviewMode('pending'));
            $('review-reviewed-btn').addEventListener('click', () => setReviewMode('reviewed'));
            $('attendance-missing-btn').addEventListener('click', () => setAttendanceMode('missing'));
            $('attendance-checked-btn').addEventListener('click', () => setAttendanceMode('checked'));
            $('company-tp-btn').addEventListener('click', () => setCompanyFilter('TP'));
            $('company-ty-btn').addEventListener('click', () => setCompanyFilter('TY'));
            $('tab-attendance').addEventListener('click', () => setPageTab('attendance'));
            $('tab-leave').addEventListener('click', () => setPageTab('leave'));
            $('user-select').addEventListener('change', (e) => {
                state.userId = safeString(e.target.value);
                localStorage.setItem('lead_leave_user', state.userId);
                render();
            });
            $('prev-month-btn').addEventListener('click', () => {
                setMonthValue(monthFromYmd(shiftMonth(`${state.month}-01`, -1)));
                localStorage.setItem('lead_leave_month', state.month);
            });
            $('next-month-btn').addEventListener('click', () => {
                if ($('next-month-btn').disabled) return;
                setMonthValue(monthFromYmd(shiftMonth(`${state.month}-01`, 1)));
                localStorage.setItem('lead_leave_month', state.month);
            });
            $('month-display').addEventListener('click', openMonthPicker);
            $('month-input').addEventListener('change', (e) => {
                const v = safeString(e.target.value);
                if (!v) return;
                setMonthValue(v);
                localStorage.setItem('lead_leave_month', state.month);
            });

            $('prev-date-btn').addEventListener('click', () => {
                setAttendanceDateValue(shiftDay(state.attendanceDate, -1));
                localStorage.setItem('lead_attendance_date', state.attendanceDate);
            });
            $('next-date-btn').addEventListener('click', () => {
                if ($('next-date-btn').disabled) return;
                setAttendanceDateValue(shiftDay(state.attendanceDate, 1));
                localStorage.setItem('lead_attendance_date', state.attendanceDate);
            });
            $('date-display').addEventListener('click', openDatePicker);
            $('date-input').addEventListener('change', (e) => {
                const v = safeString(e.target.value);
                if (!v) return;
                setAttendanceDateValue(v);
                localStorage.setItem('lead_attendance_date', state.attendanceDate);
            });

            $('close-image-btn').addEventListener('click', closeImageModal);
            attachImageZoomHandlers();
            $('image-modal').addEventListener('click', (e) => {
                if (e.target && e.target.id === 'image-modal') closeImageModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeImageModal();
            });
        }

        async function bootstrap() {
            try {
                const setVh = () => {
                    const h = window.innerHeight || document.documentElement.clientHeight || 0;
                    if (!h) return;
                    document.documentElement.style.setProperty('--vh', `${h * 0.01}px`);
                };
                setVh();
                window.addEventListener('resize', setVh);

                initFirebase();
                loadInitialState();
                bindEvents();
                lucide.createIcons();
                updateCompanyFilterButtons();
                updateReviewButtons();
                updateFooterTabs();
                updateAttendanceButtons();
                updateTopControls();
                await loadShareLinkFromUrl();

                const now = new Date();
                const defaultMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                setMonthValue(state.month && /^\d{4}-\d{2}$/.test(state.month) ? state.month : defaultMonth);
                setAttendanceDateValue(state.attendanceDate || toYmd(now));

                auth.onAuthStateChanged(async (user) => {
                    state.authUser = user || null;
                    setError('');
                    if (!user) {
                        await loadShareLinkFromUrl();
                        if (state.shareValid) {
                            setAuthWarning('');
                            subscribeShareData();
                            return;
                        }
                        setAuthWarning('請先登入後再查看西北公司內部出勤。');
                        render();
                        return;
                    }
                    setAuthWarning('');
                    $('loading-box').classList.remove('hidden');
                    $('leave-list').classList.add('hidden');
                    $('empty-box').classList.add('hidden');
                    $('attendance-loading').classList.remove('hidden');
                    $('attendance-list').classList.add('hidden');
                    $('attendance-empty').classList.add('hidden');
                    subscribeDbUserByAuth(user);
                    subscribeData();
                    buildUserOptions();
                    render();
                });
            } catch (error) {
                setError(`頁面初始化失敗：${error.message || error}`);
                $('loading-box').classList.add('hidden');
            }
        }

        bootstrap();
    </script>
</body>
</html>
